[project]
name = "meshcore-bot"
version = "0.1.0"
description = "Reply to direct MeshCore messages with hop-by-hop path stats"
authors = [
    { name = "Tobias Hoffmann", email = "garbaz.github@pm.me" }
]
requires-python = ">=3.12"
dependencies = [
    "filterpy>=1.4.5",
    "geopy>=2.5.0",
    "httpx>=0.28.1",
    "meshcore",
    "orjson>=3.12.0",
    "parsy>=2.2",
    "pyserial>=3.5",
]

[project.optional-dependencies]
ble = ["bleak>=0.22.0"]

[project.scripts]
meshcore-bot = "meshcore_bot.bot:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
meshcore = { git = "https://github.com/meshcore-dev/meshcore_py" }

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "ruff>=0.16.4",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
